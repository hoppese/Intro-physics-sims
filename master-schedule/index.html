<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHYS 230/235 — Master Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  /* Palette lifted from the course map so the two read as siblings. Light only,
     for the same reason — this page sits beside course-map-fall-26.html. */
  :root{
    --bg:#eceef1; --card:#fff; --line:#e2e6ea; --line2:#eff2f5;
    --ink:#23262b; --dim:#6b747d; --faint:#9aa2ab;
    --warn-bg:#fdf3e3; --warn-ink:#8a5a12; --warn-line:#e8d5ae;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
  code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;font-weight:600}
  a{color:#3a52a8}

  header{background:#15212e;color:#fff;padding:14px 20px;
         display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;color:#fff}
  header .term{font-size:12px;color:#9fb0bf}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
  .seg button{font:600 12px 'Source Sans 3',sans-serif;padding:6px 13px;border:0;cursor:pointer;
              background:rgba(255,255,255,.07);color:#dce6f2}
  .seg button[aria-pressed="true"]{background:#fff;color:#15212e}

  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;align-items:start}
  @media (max-width:1100px){ .wrap{grid-template-columns:minmax(0,1fr)} .panel{position:static!important} }

  .week{display:flex;gap:14px;align-items:stretch;background:var(--card);
        border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
  .bar{width:4px;flex:none;border-radius:3px}
  .wmeta{width:108px;flex:none}
  .wmeta .n{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .wmeta .u{font-weight:700;font-size:12.5px;line-height:1.25;margin-top:1px}
  .wmeta .r{font-size:11px;color:var(--dim);margin-top:2px}
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;flex:1;min-width:0}

  .day{text-align:left;background:#fafbfc;border:1px solid var(--line);border-radius:9px;
       padding:9px 11px;cursor:pointer;font:inherit;color:inherit;min-width:0}
  .day:hover{border-color:#c3ccd6;background:#fff}
  .day[aria-pressed="true"]{border-color:#6d5bd0;box-shadow:0 0 0 2px #ece9fa}
  .day .dt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
  .day .tp{font-weight:600;font-size:13.5px;margin:2px 0 5px;overflow-wrap:anywhere}
  .day .rd{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint)}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;
        padding:2px 6px;border-radius:4px;white-space:nowrap}
  .today{outline:2px solid #bf8a1e;outline-offset:1px}

  .panel{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);
         border-radius:11px;overflow:hidden}
  .phead{padding:13px 16px;color:#fff}
  .phead .u{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .phead h2{margin:3px 0 0;font-size:18px;color:#fff}
  .phead .d{font-family:'JetBrains Mono',monospace;font-size:11.5px;opacity:.85;margin-top:2px}
  .pbody{padding:13px 16px}
  .lab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
       margin:14px 0 6px}
  .lab:first-child{margin-top:0}

  table{width:100%;border-collapse:collapse}
  th{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
     text-align:left;font-weight:700;padding:0 5px 4px 0;border-bottom:1px solid var(--line2)}
  td{padding:6px 5px 6px 0;border-bottom:1px solid var(--line2);vertical-align:top;font-size:12px}
  td.num{font-family:'JetBrains Mono',monospace;text-align:right;padding-right:9px;white-space:nowrap}
  td.when{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);white-space:nowrap}
  tr.dim td{opacity:.55}

  .plan div{margin-bottom:7px}
  .plan b{display:block;font-size:11px;color:var(--dim);font-weight:700}
  .log{background:#f3f7f4;border:1px solid #cfe2d6;border-radius:8px;padding:10px 12px;font-size:12px}
  .log .row{margin-bottom:6px}
  .log .row:last-child{margin-bottom:0}
  .log b{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
         color:#4a7a5c;font-weight:700}
  .log .tim{font-family:'JetBrains Mono',monospace;font-size:11px}
  .log .over{color:#a83a3a} .log .under{color:#2a6b43}
  /* The whole log section collapses; shut by default so a day with a long entry
     still fits the panel. Summary shows a one-line peek at what was covered. */
  .logwrap{margin-top:2px}
  .logwrap > summary{cursor:pointer;list-style:none;display:block;
                     border-radius:6px;padding:1px 2px}
  .logwrap > summary::-webkit-details-marker{display:none}
  .logwrap > summary:hover .lab{color:#4a7a5c}
  .logwrap > summary:focus-visible{outline:2px solid #4a7a5c;outline-offset:2px}
  .logwrap > summary .lab::after{content:' ▸';font-size:9px}
  .logwrap[open] > summary .lab::after{content:' ▾'}
  .logwrap > summary .peek{display:block;font-size:11.5px;color:var(--faint);
                           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                           margin-top:-3px}
  .logwrap[open] > summary .peek{display:none}
  .logempty{border:1px dashed var(--line);border-radius:8px;padding:9px 11px;
            font-size:11.5px;color:var(--faint)}
  .note{background:#f5f7f9;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
        font-size:12px;margin-top:8px}
  .warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);
        border-radius:8px;padding:8px 11px;font-size:11.5px;margin-top:10px}
  .foot{padding:10px 20px 26px;font-size:11.5px;color:var(--dim)}
  .empty{color:var(--faint);font-size:12px;font-style:italic}
</style>
</head>
<body>

<header>
  <div>
    <h1>PHYS 230 / 235 — Master Schedule</h1>
    <div class="term" id="term"></div>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="trackSeg" role="group" aria-label="Section">
    <button data-track="both" aria-pressed="true">Both</button>
    <button data-track="calc" aria-pressed="false">Calc</button>
    <button data-track="alg"  aria-pressed="false">Algebra</button>
  </div>
</header>

<div class="wrap">
  <main id="weeks" aria-label="Weeks"></main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div class="foot" id="foot"></div>

<script>
const UNITS = {
  waves : {name:'Oscillations & Waves', accent:'#2b8a9e', tint:'#e7f3f5', ink:'#1c5f6d'},
  estat : {name:'Electrostatics',        accent:'#6d5bd0', tint:'#ece9fa', ink:'#473a8f'},
  circ  : {name:'Circuits',              accent:'#bf8a1e', tint:'#f6f0db', ink:'#8a6310'},
  mag   : {name:'Magnetism',             accent:'#c2576b', tint:'#f8e9ec', ink:'#8f3a4b'},
  optics: {name:'Optics',                accent:'#4b6bd6', tint:'#e8edfb', ink:'#324b9b'},
  brk   : {name:'Break',                 accent:'#9aa4ac', tint:'#eef1f4', ink:'#5b6770'},
  final : {name:'Final Exam',            accent:'#8a6310', tint:'#f8f0dd', ink:'#6d4d0c'}
};
const KIND_CHIP = {
  KO  : {bg:'#e7eaf0', fg:'#4a525b'},
  Prep: {bg:'#e6eaf7', fg:'#3a52a8'},
  OHW : {bg:'#f6ecd9', fg:'#9a6212'},
  HW  : {bg:'#e9f4ee', fg:'#2a6b43'},
  Quiz: {bg:'#f7e6e6', fg:'#a83a3a'},
  Test: {bg:'#f3e3e3', fg:'#8f2f2f'}
};
const MOODLE = 'https://moodle.earlham.edu/mod/';

let DATA = null, LOG = null, TRACK = 'both', SEL = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// an item shows for the chosen section unless it is restricted to the other one
const visible = e => TRACK === 'both' || e.track === 'both' || e.track === TRACK
                     || (Array.isArray(e.track) && e.track.includes(TRACK));

// "Sep 25" + the term's year -> a Date, for the today marker only
function dayDate(d, year){
  const m = String(d.date).match(/^([A-Za-z]{3})\s+(\d+)/);
  if (!m) return null;
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(m[1]);
  return mo < 0 ? null : new Date(year, mo, +m[2]);
}
const shortWhen = s => s ? s.slice(5).replace('-', '/').replace(' ', ' ') : '—';

function render(){
  const year = +(DATA.course.term.match(/\d{4}/) || [2026])[0];
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('term').textContent =
    DATA.course.term + ' · ' + DATA.course.timezone + ' · times are local wall clock';

  const host = document.getElementById('weeks');
  host.innerHTML = '';
  DATA.weeks.forEach((wk, wi) => {
    const u = UNITS[wk.unit] || UNITS.brk;
    const row = document.createElement('section');
    row.className = 'week';
    row.innerHTML =
      `<div class="bar" style="background:${u.accent}"></div>
       <div class="wmeta"><div class="n">Week ${esc(wk.n)}</div>
         <div class="u" style="color:${u.ink}">${esc(u.name)}</div>
         <div class="r">${esc(wk.range)}</div></div>
       <div class="days"></div>`;
    const slot = row.querySelector('.days');
    wk.days.forEach((d, di) => {
      const due = (d.due || []).filter(visible);
      const b = document.createElement('button');
      b.className = 'day';
      b.setAttribute('aria-pressed', String(SEL === `${wi}-${di}`));
      const dd = dayDate(d, year);
      if (dd && dd.getTime() === today.getTime()) b.classList.add('today');
      b.innerHTML =
        `<div class="dt">${esc(d.dow || '')} ${esc(d.date)}</div>
         <div class="tp">${esc(d.topic || '—')}</div>
         ${d.reading ? `<div class="rd">K ${esc(d.reading)}</div>` : ''}
         <div class="chips">${due.map(e => {
           const c = KIND_CHIP[e.kind] || {bg:'#eee', fg:'#555'};
           return `<span class="chip" style="background:${c.bg};color:${c.fg}">${esc(e.label)}</span>`;
         }).join('')}</div>`;
      b.onclick = () => { SEL = `${wi}-${di}`; render(); };
      slot.appendChild(b);
    });
    host.appendChild(row);
  });

  renderPanel(year);
  const items = DATA.weeks.flatMap(w => w.days.flatMap(d => d.due || []));
  const shown = items.filter(visible);
  const pts = shown.reduce((s, e) => s + (+e.points || 0), 0);
  document.getElementById('foot').textContent =
    `${shown.length} graded items · ${pts} points total for this section · ` +
    `source: data/schedule.json — edit that file, not this page.`;
}

// What actually happened, from data/teaching-log.json. Shown against the nominal
// 50-minute split so planned-vs-actual is visible when next year's schedule is built.
function logBlock(d, year){
  const dd = dayDate(d, year);
  if (!dd) return '';
  const key = `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
  const e = LOG && LOG.entries && LOG.entries[key];
  const past = dd <= new Date();
  if (!e){
    return past && d.plan
      ? `<div class="lab">What actually happened</div>
         <div class="logempty">No entry yet for ${esc(key)} — add one to
         <code>data/teaching-log.json</code> under <code>entries</code>.</div>`
      : '';
  }
  const nom = (LOG && LOG.nominalPlan) || {};
  const timing = e.timing ? Object.entries(e.timing).map(([seg, min]) => {
      const n = nom[seg];
      const cls = n == null ? '' : (min > n ? ' over' : (min < n ? ' under' : ''));
      const delta = n == null ? '' : ` (${min > n ? '+' : ''}${min - n})`;
      return `<span class="tim${cls}">${esc(seg)} ${min}′${esc(delta)}</span>`;
    }).join(' · ') : '';
  const row = (label, val) => val ? `<div class="row"><b>${label}</b>${esc(val)}</div>` : '';
  const total = e.timing ? Object.values(e.timing).reduce((a, b) => a + (+b || 0), 0) : null;

  // Anything from the log's materials list that was handed out on this day —
  // skeleton lecture notes, practice worksheets — linked so it can be reprinted.
  const mats = ((LOG && LOG.materials) || []).filter(m => m.usedOn === key);
  const matRow = mats.length ? `<div class="row"><b>Handed out</b>
      ${mats.map(m => `<div><a href="../${esc(m.file)}" target="_blank" rel="noopener">${esc(m.name || m.file.split('/').pop())}</a>
        <span class="mono" style="font-size:10px;color:#9aa2ab">${esc(m.kind)}</span></div>`).join('')}
    </div>` : '';

  // The whole block collapses. A full entry is longer than everything else on
  // the day put together, so it stays shut until asked for; the summary carries
  // a one-line taste of what was covered so a shut block is not a blank label.
  return `<details class="logwrap">
      <summary><span class="lab">What actually happened</span>
        <span class="peek">${esc(e.covered || '')}</span></summary>
      <div class="log">
        ${row('Covered', e.covered)}
        ${timing ? `<div class="row"><b>Timing${total ? ` — ${total}′ of 50` : ''}</b>${timing}</div>` : ''}
        ${matRow}
        ${row('Cut for time', e.cut)}
        ${row('Wish there had been time for', e.wish)}
        ${row('Landed well', e.landed)}
        ${row('Students struggled with', e.struggled)}
        ${row('For next year', e.nextYear)}
        ${row('Notes', e.notes)}
      </div>
    </details>`;
}

function renderPanel(year){
  const p = document.getElementById('panel');
  if (!SEL){ p.innerHTML = `<div class="pbody empty">Pick a day to see what is scheduled.</div>`; return; }
  const [wi, di] = SEL.split('-').map(Number);
  const wk = DATA.weeks[wi], d = wk.days[di];
  const u = UNITS[wk.unit] || UNITS.brk;
  const due = (d.due || []).filter(visible);

  const rows = due.map(e => {
    const link = e.cmid
      ? `<a href="${MOODLE}${e.module}/view.php?id=${e.cmid}" target="_blank" rel="noopener">open</a>`
      : `<span class="mono" style="color:#9aa2ab">—</span>`;
    const trackTag = e.track === 'both' ? '' :
      ` <span class="mono" style="font-size:9.5px;color:#9aa2ab">${esc(Array.isArray(e.track) ? e.track.join('/') : e.track)}</span>`;
    return `<tr${e.cmid ? '' : ' class="dim"'}>
      <td><b>${esc(e.label)}</b>${trackTag}</td>
      <td class="num">${e.points ?? '—'}</td>
      <td class="num">${e.attempts ?? '—'}</td>
      <td class="when">${esc(shortWhen(e.opens))}</td>
      <td class="when">${esc(shortWhen(e.closes))}</td>
      <td class="num">${link}</td></tr>`;
  }).join('');

  const noMoodle = due.filter(e => !e.cmid);
  p.innerHTML =
    `<div class="phead" style="background:${u.accent}">
       <div class="u">${esc(u.name)}</div>
       <h2>${esc(d.topic || d.date)}</h2>
       <div class="d">${esc(d.dow || '')} ${esc(d.date)}${d.reading ? ' · Knight ' + esc(d.reading) : ''}</div>
     </div>
     <div class="pbody">
       <div class="lab">Due this day</div>
       ${due.length ? `<table><thead><tr>
            <th>Item</th><th style="text-align:right">Pts</th><th style="text-align:right">Att</th>
            <th>Opens</th><th>Closes</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
          : `<div class="empty">Nothing due.</div>`}
       ${noMoodle.length ? `<div class="warn"><b>${noMoodle.length} item${noMoodle.length>1?'s':''} not in Moodle</b> —
            ${esc(noMoodle.map(e => e.label).join(', '))}. ${esc(noMoodle[0].note || '')}</div>` : ''}
       ${d.split ? `<div class="note"><b>Split day.</b>
            ${d.calc ? `<div style="margin-top:4px"><b>Calc:</b> ${esc(d.calc)}</div>` : ''}
            ${d.alg  ? `<div style="margin-top:2px"><b>Algebra:</b> ${esc(d.alg)}</div>` : ''}</div>` : ''}
       ${d.plan ? `<div class="lab">50-minute plan</div><div class="plan">
            ${d.plan.lec  ? `<div><b>Mini-lecture</b>${esc(d.plan.lec)}</div>` : ''}
            ${d.plan.exp  ? `<div><b>Explore</b>${esc(d.plan.exp)}</div>` : ''}
            ${d.plan.prac ? `<div><b>Practice</b>${esc(d.plan.prac)}</div>` : ''}</div>` : ''}
       ${logBlock(d, year)}
       ${(d.video && d.video.id) || (d.sims || []).length || (d.handouts || []).length ? `<div class="lab">Links</div>
            ${d.video && d.video.id ? `<div><a href="https://www.youtube.com/watch?v=${esc(d.video.id)}" target="_blank" rel="noopener">Pre-class video</a>
              ${d.video.st === 'unv' ? '<span class="mono" style="font-size:10px;color:#9aa2ab"> unvetted</span>' : ''}</div>` : ''}
            ${(d.handouts || []).map(h =>
              `<div><a href="../${esc(h.file)}" target="_blank" rel="noopener">${esc(h.name)}</a>
                <span class="mono" style="font-size:10px;color:#9aa2ab"> print ${h.pages} pp</span></div>`).join('')}
            ${(d.sims || []).map(s => s.slug
              ? `<div><a href="../${esc(s.slug)}/index.html" target="_blank" rel="noopener">${esc(s.name)}</a></div>`
              : `<div class="empty">${esc(s.name)} (no sim linked)</div>`).join('')}` : ''}
     </div>`;
}

document.getElementById('trackSeg').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  TRACK = b.dataset.track;
  [...ev.currentTarget.querySelectorAll('button')]
    .forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});

Promise.all([
  fetch('../data/schedule.json').then(r => {
    if (!r.ok) throw new Error('schedule.json: HTTP ' + r.status); return r.json(); }),
  // the log is optional — a missing or broken file must not take the page down
  fetch('../data/teaching-log.json').then(r => r.ok ? r.json() : null).catch(() => null)
])
  .then(([j, lg]) => {
    DATA = j; LOG = lg;
    // open on today if the term is running, else on the first teaching day
    const year = +(j.course.term.match(/\d{4}/) || [2026])[0];
    const today = new Date(); today.setHours(0,0,0,0);
    outer: for (let wi = 0; wi < j.weeks.length; wi++)
      for (let di = 0; di < j.weeks[wi].days.length; di++){
        const dd = dayDate(j.weeks[wi].days[di], year);
        if (dd && dd.getTime() >= today.getTime()){ SEL = `${wi}-${di}`; break outer; }
      }
    if (!SEL) SEL = '0-0';
    render();
  })
  .catch(e => {
    document.getElementById('weeks').innerHTML =
      `<div class="week"><div class="bar" style="background:#c2576b"></div><div style="padding:4px 2px">
        <b>Could not load data/schedule.json</b> — ${esc(e.message)}.<br>
        <span style="color:#6b747d">This page reads the file over HTTP, so open it from a server
        (e.g. <code>python3 -m http.server</code> at the repo root), not as a <code>file://</code> URL.</span>
      </div></div>`;
  });
</script>
</body>
</html>
